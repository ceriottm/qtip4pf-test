  #   runs-on: ubuntu-24.04
  #   environment: pypi
  #   permissions:
  #     id-token: write
  #   steps:
  #     - uses: actions/download-artifact@v8
  #       with:
  #         name: dist
  #         path: dist
  #
  #     - uses: pypa/gh-action-pypi-publish@release/v1
