name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - pyproject.toml
      - .github/workflows/release.yml

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  # The package is not published on PyPI for now. To publish it, uncomment this job.
  #
  # publish:
  #   # requires a "trusted publisher" for this repository on PyPI, see
  #   # https://docs.pypi.org/trusted-publishers/
